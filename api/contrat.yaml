openapi: 3.0.3
info:
  title: Contrat — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations imposées par le sujet, plus celles ajoutées pour couvrir
    les règles de gestion (Q10, Q12, Q13). Toutes les erreurs respectent le format
    { "code": "...", "message": "..." }.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session (EF1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture une session (EF11 — ajoutée)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Session clôturée }
        "404": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence (EF3, EF4, EF10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
                source: { type: string, enum: [ETUDIANT, FORMATEUR], default: ETUDIANT }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }
        "410": { $ref: "#/components/responses/Erreur" }

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice (EF5, EF6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [DEPOSE, EN_ATTENTE_RELECTURE, RELU] }
        "400": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire (EF8, RG9)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }
        "403": { $ref: "#/components/responses/Erreur" }
        "409": { $ref: "#/components/responses/Erreur" }

  /api/tableau:
    get:
      summary: Tableau récapitulatif du formateur (EF9, Q16)
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Erreur:
      description: Format d'erreur imposé pour toutes les erreurs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
